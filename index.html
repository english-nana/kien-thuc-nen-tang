<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lấy Lại Gốc Tiếng Anh</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" defer></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com" defer></script>

    <style>
        body {
            animation: fadeInPage 0.3s ease-in forwards;
            background-color: #f8fafc;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
        }

        @keyframes fadeInPage {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .flip-card {
            perspective: 1000px;
        }

        .flip-card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .flip-card-back {
            transform: rotateY(180deg);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        @keyframes pop {
            0% {
                transform: scale(0.98);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-pop {
            animation: pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-4px);
            }

            20%,
            40%,
            60%,
            80% {
                transform: translateX(4px);
            }
        }

        .animate-shake {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }

        .highlight-text {
            background-color: #fef08a;
            padding: 0 4px;
            border-radius: 4px;
            font-weight: 600;
            color: #b45309;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes slideRight {
            100% {
                transform: translateX(200%);
            }
        }
    </style>

    <script src="dist/dung-chung.js" defer></script>

    <script src="dist/dai-tu.js" defer></script>
    <script src="dist/danh-tu.js" defer></script>
    <script src="dist/cum-danh-tu.js" defer></script>
    <script src="dist/dong-tu.js" defer></script>
    <script src="dist/gioi-tu.js" defer></script>
    <script src="dist/tu-noi.js" defer></script>
    <script src="dist/cau-ghep.js" defer></script>
    <script src="dist/menh-de-quan-he.js" defer></script>
    <script src="dist/cau-phuc.js" defer></script>
    <script src="dist/tinh-tu.js" defer></script>
    <script src="dist/trang-tu.js" defer></script>
</head>

<body>
    <div id="root"></div>

    <script src="dist/main.js" defer></script>
</body>

</html>
